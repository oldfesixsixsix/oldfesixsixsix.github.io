<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>好室設計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Noto+Sans+TC:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page-title="">

<header id="top">
  <div class="wrap nav">
    <a href="./" class="logo" data-logo></a>
    <nav class="menu" id="menu">
      <a href="product/">作品與服務</a>
      <a href="about/">關於我們</a>
      <a href="news/">最新消息</a>
      <a href="blog/">設計專欄</a>
      <a href="contact/">聯絡我們</a>
    </nav>
    <button class="burger" id="burger" aria-label="選單"><i></i><i></i><i></i></button>
  </div>
</header>

<div class="hero" id="hero">
  <div class="wrap hero-text">
    <span class="en" data-bind="home.tagline"></span>
    <h1 data-bind="home.title"></h1>
    <p data-bind="home.subtitle"></p>
  </div>
  <div class="dots" id="dots"></div>
</div>

<section>
  <div class="wrap">
    <div class="head center reveal"><span class="en">Welcome</span><h2 data-bind="home.welcomeTitle"></h2>
      <p class="lead" style="margin-top:20px" data-bind="home.welcomeText"></p>
    </div>
    <div class="teasers">
      <a class="teaser reveal" href="product/" data-teaser="product"><div><span class="en">Product</span><h3>作品與服務</h3></div></a>
      <a class="teaser reveal" href="about/" data-teaser="about"><div><span class="en">About</span><h3>關於我們</h3></div></a>
      <a class="teaser reveal" href="news/" data-teaser="news"><div><span class="en">News</span><h3>最新消息</h3></div></a>
      <a class="teaser reveal" href="blog/" data-teaser="blog"><div><span class="en">Blog</span><h3>設計專欄</h3></div></a>
    </div>
  </div>
</section>

<section class="cta">
  <div class="wrap">
    <div class="head center reveal"><span class="en">Let's talk</span><h2>開始規劃你的家</h2></div>
    <p class="reveal">免費初步諮詢，設計顧問兩個工作天內與您聯繫。</p>
    <a href="contact/" class="btn reveal">預約諮詢</a>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot">
      <a href="./" class="logo" data-logo></a>
      <div><span data-bind="contact.phone"></span>　｜　<span data-bind="contact.email"></span></div>
    </div>
    <div class="copy">© <span data-year></span> <span data-bind="brand.fullName"></span> · <span data-bind="brand.footer"></span></div>
  </div>
</footer>

<script src="assets/site.js"></script>
</body>
</html>
