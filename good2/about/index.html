<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>關於我們｜好室設計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Noto+Sans+TC:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page-title="關於我們">

<header id="top">
  <div class="wrap nav">
    <a href="../" class="logo" data-logo></a>
    <nav class="menu" id="menu">
      <a href="../product/">作品與服務</a>
      <a href="../about/" class="active">關於我們</a>
      <a href="../news/">最新消息</a>
      <a href="../blog/">設計專欄</a>
      <a href="../contact/">聯絡我們</a>
    </nav>
    <button class="burger" id="burger" aria-label="選單"><i></i><i></i><i></i></button>
  </div>
</header>

<div class="banner">
  <img data-banner="about" alt="">
  <div class="wrap">
    <span class="en">About us</span>
    <h1>關於我們</h1>
    <div class="crumb"><a href="../">首頁</a>　/　關於我們</div>
  </div>
</div>

<section>
  <div class="wrap about">
    <div class="pic reveal" id="about-img"></div>
    <div class="reveal">
      <div class="head"><span class="en">Our story</span><h2>關於<span data-bind="brand.name"></span></h2></div>
      <blockquote data-bind="about.quote"></blockquote>
      <div id="about-text"></div>
      <div class="stats" id="stats"></div>
    </div>
  </div>
</section>

<section class="process">
  <div class="wrap">
    <div class="head center reveal"><span class="en">Process</span><h2>設計流程</h2></div>
    <div class="steps reveal" id="steps"></div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="head center reveal"><span class="en">Team</span><h2>設計團隊</h2></div>
    <div class="team" id="team"></div>
  </div>
</section>

<section class="cta">
  <div class="wrap">
    <div class="head center reveal"><span class="en">Let's talk</span><h2>開始規劃你的家</h2></div>
    <p class="reveal">免費初步諮詢，設計顧問兩個工作天內與您聯繫。</p>
    <a href="../contact/" class="btn reveal">預約諮詢</a>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot">
      <a href="../" class="logo" data-logo></a>
      <div><span data-bind="contact.phone"></span>　｜　<span data-bind="contact.email"></span></div>
    </div>
    <div class="copy">© <span data-year></span> <span data-bind="brand.fullName"></span> · <span data-bind="brand.footer"></span></div>
  </div>
</footer>

<script src="../assets/site.js"></script>
</body>
</html>
