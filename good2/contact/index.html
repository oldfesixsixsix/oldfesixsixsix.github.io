<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聯絡我們｜好室設計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Noto+Sans+TC:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page-title="聯絡我們">

<header id="top">
  <div class="wrap nav">
    <a href="../" class="logo" data-logo></a>
    <nav class="menu" id="menu">
      <a href="../product/">作品與服務</a>
      <a href="../about/">關於我們</a>
      <a href="../news/">最新消息</a>
      <a href="../blog/">設計專欄</a>
      <a href="../contact/" class="active">聯絡我們</a>
    </nav>
    <button class="burger" id="burger" aria-label="選單"><i></i><i></i><i></i></button>
  </div>
</header>

<div class="banner">
  <img data-banner="contact" alt="">
  <div class="wrap">
    <span class="en">Contact</span>
    <h1>聯絡我們</h1>
    <div class="crumb"><a href="../">首頁</a>　/　聯絡我們</div>
  </div>
</div>

<section>
  <div class="wrap contact">
    <div class="info reveal">
      <div class="head"><span class="en">Get in touch</span><h2>預約諮詢</h2></div>
      <p style="color:var(--muted)" data-bind="contact.intro"></p>
      <dl>
        <dt>電話</dt><dd data-bind="contact.phone"></dd>
        <dt>信箱</dt><dd data-bind="contact.email"></dd>
        <dt>地址</dt><dd data-bind="contact.address"></dd>
        <dt>營業時間</dt><dd data-bind="contact.hours"></dd>
      </dl>
    </div>
    <form id="form" class="reveal" novalidate>
      <div class="f"><label>姓名 <em>*</em></label><input name="name" required></div>
      <div class="f"><label>聯絡電話 <em>*</em></label><input name="phone" type="tel" required></div>
      <div class="f full"><label>電子信箱</label><input name="email" type="email"></div>
      <div class="f full"><label>空間類型</label>
        <div class="chips">
          <label><input type="radio" name="type" value="新成屋" checked><span>新成屋</span></label>
          <label><input type="radio" name="type" value="預售屋"><span>預售屋</span></label>
          <label><input type="radio" name="type" value="老屋翻新"><span>老屋翻新</span></label>
          <label><input type="radio" name="type" value="商業空間"><span>商業空間</span></label>
        </div>
      </div>
      <div class="f"><label>坪數</label><input name="size" placeholder="例：30 坪"></div>
      <div class="f"><label>預算範圍</label>
        <select name="budget"><option>請選擇</option><option>100 萬以下</option><option>100 – 200 萬</option><option>200 – 400 萬</option><option>400 萬以上</option></select>
      </div>
      <div class="f full"><label>需求描述</label><textarea name="msg" placeholder="家庭成員、喜歡的風格、預計入住時間……"></textarea></div>
      <label class="agree f full"><input type="checkbox" required> 我同意貴公司使用以上資料與我聯繫</label>
      <div class="f full"><button class="btn" type="submit">送出預約</button></div>
      <div class="ok" id="ok">感謝您的預約！這是示範網站，資料不會實際送出。</div>
    </form>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot">
      <a href="../" class="logo" data-logo></a>
      <div><span data-bind="contact.phone"></span>　｜　<span data-bind="contact.email"></span></div>
    </div>
    <div class="copy">© <span data-year></span> <span data-bind="brand.fullName"></span> · <span data-bind="brand.footer"></span></div>
  </div>
</footer>

<script src="../assets/site.js"></script>
</body>
</html>
